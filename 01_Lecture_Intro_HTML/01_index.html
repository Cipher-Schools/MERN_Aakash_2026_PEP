<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta information about the page -->
    <meta charset="UTF-8"> <!-- Supports almost all characters -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Makes site responsive -->
    <title>My First Web Page</title> <!-- Title shown on browser tab -->
</head>
<body>
    <!-- Everything visible on the webpage goes inside body -->
    <h1>Welcome to Web Development</h1>
    <p>This is a basic HTML document structure.</p>
</body>
</html>
