<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Attributes</title>
</head>
<body>

    <!-- Attributes providing additional information to tags

    Difference between id and class
    Global attributes like title -->

    <!-- ID attribute (unique) -->
    <div id="main-container">This div has a unique ID</div>

    <!-- Class attribute (reusable) -->
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>

    <!-- Global attribute: title -->
    <p title="Tooltip text appears on hover">
        Hover over this paragraph
    </p>

    <!-- Image attributes -->
    <img src="image.png" alt="Profile image" width="150">

    <!-- Anchor attribute -->
    <a href="https://example.com" target="_blank">Open Example</a>

</body>
</html>
