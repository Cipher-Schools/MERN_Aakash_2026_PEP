<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semantic HTML</title>
</head>
<body>

    <!-- Semantic structure -->
    <header>
        <h1>My Blog</h1>
    </header>

    <nav>
        <a href="#">Home</a> |
        <a href="#">About</a>
    </nav>

    <main>
        <section>
            <h2>Article Title</h2>
            <p>This is an article section.</p>
        </section>

        <aside>
            <p>Related posts</p>
        </aside>
    </main>

    <footer>
        <p>Copyright 2026</p>
    </footer>

    <!-- Generic containers -->
    <div>This is a generic div container</div>
    <span>This is a generic inline container</span>

</body>
</html>
