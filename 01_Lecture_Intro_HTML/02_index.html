<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Common Tags</title>
</head>
<body>

    <!-- Headings define importance and structure -->
    <h1>Main Heading</h1>
    <h2>Sub Heading</h2>
    <h3>Section Heading</h3>

    <!-- Paragraph -->
    <p>This is a paragraph used to display blocks of text.</p>

    <!-- Block element (div) vs inline element (span) -->
    <!-- Block-level container -->
    <div>
        This content is inside a div. Div takes full width by default.
    </div>

    <!-- Inline container -->
    <span>This is inside a span.</span>
    <span>Span does not start on a new line.</span>

</body>
</html>
