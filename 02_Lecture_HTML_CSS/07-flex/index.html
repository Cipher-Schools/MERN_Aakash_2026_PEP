<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox Basics</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .parent {
            border: 2px solid black;
            width: 600px;
            height: 200px;
            margin: 20px;
            display: flex;
        }

        .child {
            border: 1px solid red;
            width: 80px;
            height: 80px;
        }

        #one, #div_one { background-color: aqua; }
        #two, #div_two { background-color: lightcoral; }
        #three, #div_three { background-color: lightgreen; }
        #four ,#div_four { background-color: lightskyblue; }
    
        #div_one {
            flex-grow: 2;
        }
        #div_two {
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <h2>Default Flex (row)</h2>
    <div class="parent">
        <div class="child" id="one">1</div>
        <div class="child" id="two">2</div>
        <div class="child" id="three">3</div>
        <div class="child" id="four">4</div>
    </div>

    <h2>Flex Direction: Column</h2>
    <div class="parent" style="flex-direction: column;">
        <div class="child" id="one">1</div>
        <div class="child" id="two">2</div>
        <div class="child" id="three">3</div>
        <div class="child" id="four">4</div>
    </div>

    <h2>Justify Content: Center</h2>
    <div class="parent" style="justify-content: center;">
        <div class="child" id="one">1</div>
        <div class="child" id="two">2</div>
        <div class="child" id="three">3</div>
    </div>

    <h2>Justify Content: Space Between</h2>
    <div class="parent" style="justify-content: space-between;">
        <div class="child" id="one">1</div>
        <div class="child" id="two">2</div>
        <div class="child" id="three">3</div>
    </div>

    <h2>Align Items: Center</h2>
    <div class="parent" style="align-items: center;">
        <div class="child" id="one">1</div>
        <div class="child" id="two">2</div>
        <div class="child" id="three">3</div>
    </div>

    <h2>Align flex items in center using flex</h2>
    <div class="parent" style="justify-content: center; align-items: center;">
        <div class="child" id="one">1</div>
        <div class="child" id="two">2</div>
        <div class="child" id="three">3</div>
        <div class="child" id="four">4</div>
        <div class="child" id="one">5</div>
        <div class="child" id="two">6</div>
    </div>

    <h2>Flex Grow</h2>
    <div class="parent">
        <div class="child" id="div_one">1</div>
        <div class="child" id="div_two">2</div>
        <div class="child" id="div_three">3</div>
        <div class="child" id="div_four">4</div>
    </div>

</body>
</html>

<!-- What this code demonstrates:

Flex container and items

Alignment and spacing

Responsive distribution using flex-grow -->
