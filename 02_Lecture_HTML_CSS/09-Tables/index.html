<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Table Example</title>
</head>
<body>

    <h2>Student Marks Table</h2>

    <table border="1" cellpadding="8">
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Aniket</td>
            <td>Math</td>
            <td>92</td>
        </tr>
        <tr>
            <td>Riya</td>
            <td>Science</td>
            <td>88</td>
        </tr>
    </table>

</body>
</html>


<!-- What this code demonstrates:

Table structure using rows and cells

Header cells vs data cells

Tabular data representation -->
