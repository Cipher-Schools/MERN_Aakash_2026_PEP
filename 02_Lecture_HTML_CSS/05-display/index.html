<!DOCTYPE html>
<html>
<head>
    <title>Display Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Default Behavior</h2>

<span class="default-inline">Span 1</span>
<span class="default-inline">Span 2</span>

<div class="default-block">Div 1</div>
<div class="default-block">Div 2</div>

<hr>

<h2>Changed Behavior</h2>

<span class="span-to-block">Span acting like Block</span>
<span class="span-to-block">Span acting like Block</span>

<div class="div-to-inline">Div acting like Inline</div>
<div class="div-to-inline">Div acting like Inline</div>

<hr>

<h2>Inline-Block Example</h2>

<span class="inline-block">Box 1</span>
<span class="inline-block">Box 2</span>
<span class="inline-block">Box 3</span>

</body>
</html>
