<!DOCTYPE html>
<html>
<head>
    <title>CSS Types</title>

    <style>
        h2 {
            color: blue;
        }

        ul {
            color: purple;
        }

        .box {
            border: 2px solid black;
            padding: 10px;
            margin: 10px;
        }
    </style>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 style="color: red;">Inline CSS</h1>

<h2>Internal CSS</h2>

<h3>External CSS</h3>

<hr>

<h4>Lists Example</h4>

<ul>
    <li>Frontend</li>
    <li>Backend</li>
    <li>Database</li>
</ul>

<ol>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ol>

<hr>

<h4>Nested Div Example</h4>

<div class="box">
    Parent Div
    <div class="box">
        Child Div
        <div class="box" id="grandchild">
            Grandchild Div
        </div>
    </div>
</div>

</body>
</html>

<!-- What this code demonstrates:

Font styling

Element, class, and ID selectors

Inline, Embedded and External CSS usage -->
