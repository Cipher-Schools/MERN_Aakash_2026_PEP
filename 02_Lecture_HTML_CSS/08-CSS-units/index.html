<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Units</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Units Demo</h1>

    <h2>px (Fixed)</h2>
    <div class="box px-box">200px width</div>

    <h2>% (Relative to Parent)</h2>
    <div class="parent">
        <div class="box percent-box">50%</div>
    </div>

    <h2>vw (Viewport Width)</h2>
    <div class="box vw-box">50vw</div>

    <h2>vh (Viewport Height)</h2>
    <div class="box vh-box">20vh</div>

    <h2>em (Relative to Parent Font Size)</h2>
    <div class="em-parent">
        Parent text
        <p class="em-text">This is 2em</p>
    </div>

    <h2>rem (Relative to Root Font Size)</h2>
    <p class="rem-text">This is 2rem</p>

</body>
</html>
