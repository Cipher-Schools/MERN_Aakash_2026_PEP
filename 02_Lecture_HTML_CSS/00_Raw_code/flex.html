<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        .parent {
            border: 2px solid black;
            width: 600px;
            height: 300px;
            display: flex;
            flex-direction:row;
            justify-content:center;
            align-items: center;
            /* align-content: ; */
        }
        .divs{
            border: 1px solid red;
            width: 20vw;
            height: 30vw;
        }
        #div_1{
            background-color: aqua;
        }
        #div_2{
            background-color: red;
        }
        #div_3{
            background-color:blueviolet;
        }
        #div_4{
            background-color:chocolate;
        }
        #div_5{
            background-color:chartreuse;
        }
    </style>
</head>
<body>
    
    <div class="parent">
        <div class="divs" id="div_1">i am a div 1</div>
        
        <div class="divs" id="div_2">i am a div 2</div>
        
        <div class="divs" id="div_3">i am a div 3</div>
        
        <div class="divs" id="div_4">i am a div 4</div>
        
    </div>
    
    <div class="divs" id="div_5">i am a div 5</div>
    
</body>
</html>
