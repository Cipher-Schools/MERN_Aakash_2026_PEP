<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            width: 100px;
            height: 50px;
            background-color: aqua;
        }

        @media (min-width:400px) and (max-width:600px) {
            .parent {
                background-color: blue;
            }
        }

        .navbar{
            background-color: antiquewhite;
            width: 80vw;
            /* height: 50px; */
            border: 2px solid black;
            padding: 20px;
            display: flex;
            justify-content: space-between;
        }

        .logo {
            border: 2px solid red;
        }
        .par{
            display: flex;
            gap: 10px;
        }
        .childs{
            border: 2px solid green;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (max-width:500px) {
            .navbar{
                flex-direction: column;
            }
            .par{
                flex-direction: column;
            }
        }
    

    </style>
</head>
<body>
    <div class="parent">
    </div>

    <br>
    <br>
    <br>

    

    <nav class="navbar">
        <div class="logo">LOGO</div>

        <div class="par">
            <div class="childs" id="home">Home</div>
            <div class="childs" id="about">About</div>
            <div class="childs" id="contact">Contact</div>
            <div class="childs" id="et1">ETC_1</div>
            <div class="childs" id="et2">ETC_2</div>
        </div>
    </nav>
</body>
</html>
<!-- 
What this code demonstrates:

Responsive design using media queries

Changing styles for different screen sizes -->
