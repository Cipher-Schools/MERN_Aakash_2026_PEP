<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        .para{
            position: relative;
            width: 80vw;
            height: 100px;
            top: 20px;
            left: 50%;
            border: 2px solid black;
            background-color: aqua;
        }

        .parent{
            position: relative;
            margin-top: 50px;
            border: 2px solid black;
            background-color: antiquewhite;
            width: 400px;
            height: 400px;
        }

        .child{
            background-color: aqua;
            width: 100px;
            height: 150px;
            border: 2px solid red;
            position: absolute;
            top: 50px;
        }

        /* ************************************ */

        .box {
            width: 100px;
            height: 100px;
            color: white;
            text-align: center;
            line-height: 100px;
        }

        .static { background: gray; }

        .relative {
            background: blue;
            position: relative;
            top: 20px;
            left: 20px;
        }

        .absolute {
            background: red;
            position: absolute;
            top: 50px;
            left: 150px;
        }

        .fixed {
            background: green;
            position: fixed;
            bottom: 10px;
            right: 10px;
        }

        .sticky {
            background: purple;
            position: sticky;
            top: 10px;
        }


    </style>
</head>
<body style="height: 2000px;">
    <p class="para">Hii i am a paragraph</p>

    <div class="parent">
        <div class="child"></div>
    </div>

    <div class="box static">Static</div>
    <div class="box relative">Relative</div>
    <div class="box absolute">Absolute</div>
    <div class="box sticky">Sticky</div>
    <div class="box fixed">Fixed</div>


</body>
</html>


<!-- What this code demonstrates:

Differences between positioning types

How elements move relative to viewport or parent -->
