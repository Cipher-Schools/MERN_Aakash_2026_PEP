<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            color: white;
        }
        body{
            padding: 100px;
        }

        .parent{
            margin-top: 50px;
            border: 2px solid black;
            background-color: bisque;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 150px);
            
            gap: 10px;

            grid-auto-rows: 150px;

        }

        .child{
            border: 2px solid black;
        }

        #div_1{
            background-color: brown;
            /* grid-row-start: 1;
            grid-row-end: 3; */
            grid-column-start: 2;
            grid-column-end: 3;
        }
        #div_2{
            background-color: green;
        }
        #div_3{
            background-color: orange;
        }
        #div_4{
            background-color: blue;
        }
        #div_5{
            background-color: red;
        }
        #div_6{
            background-color: yellow;
        }

        .child:nth-child(6){
            background-color: cadetblue;
        }

        /* ********************* */

        .grid-container {
            margin-top: 100px;
            display: grid;
            grid-template-columns: 200px 1fr 1fr;
            grid-template-rows: 100px auto;
            column-gap: 10px;
            row-gap: 10px;
        }

        .item {
            background-color: lightgreen;
            padding: 20px;
            border: 1px solid black;
        }

        .item1 {
            grid-column: 1 / 3;
        }

        .item2 {
            grid-row: 2 / 3;
        }

    </style>
</head>
<body>
    <div class="parent">
        <div class="child" id="div_1">1</div>
        <div class="child" id="div_2">2</div>
        <div class="child" id="div_3">3</div>
        <div class="child" id="div_4">4</div>
        <div class="child" id="div_5">5</div>
        <div class="child">6</div>
    </div>

    <!-- <hr> -->

    <div class="grid-container">
        <div class="item item1">Header Area</div>
        <div class="item">Sidebar</div>
        <div class="item item2">Main Content</div>
        <div class="item">Extra</div>
    </div>

</body>
</html>

Placing items using grid lines -->
